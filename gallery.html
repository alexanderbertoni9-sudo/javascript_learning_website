<!DOCTYPE html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel = "icon" href = "assets/img/SVG/Logo_Black.svg">
        <title>Gallery</title>
    </head>
    <body>
        <img id = "cursor-follower" src = "assets/cursor/cursor_pointer.png">

        <div class="navbar">
            <ul>
                <li><img id="logo" class="logo" src="assets/img/SVG/Logo_Red.svg"></li>
                <li><a class="button_cursor" href="index.html">Home</a></li>
                <li><a class="button_cursor" href="gallery.html">Gallery</a></li>
                <li><a class="button_cursor" href="#about.html">About</a></li>
                <li class="right-aligned">
                    <button id="themeCycleBtn" class="button_cursor" onclick="themeCycle()">Cycle Theme (Next: blue)</button>
                    <button id="darkMode" class="button_cursor" onclick="darkToggle()">Toggle Dark Mode</button>
                </li>
            </ul>
        </div>

        <div class="center">
            <h1 class ="grow center text_cursor" >Gallery</h1>
        </div>

        <div class = "gallery">
            <div id = "open" class = "card grow_gallery button_cursor" id = "open_customCursor"><img class = "gallery_preview" src = "assets/Gallery Previews/custom_cursor.gif"  ></div>
            <div class = "card"><img src = "assets/img/SVG/Logo_White.svg"></div>
        </div>

        <!-- Popup for the custom cursor code stuff -->
        <div class="modal-container" id="modal-container">
            <div class="modal">
                <div class = "topbar"> 
                    <button class = "button_cursor close_button" id = "close">X</button>
                    <p class = "tooltip help_cursor" id="tooltip1">↓ press a tab to get started!</p>
                </div>
                
                <div class = "tab-group">
                    
                    <!-- Tab 1 -->
                    <input type = "radio" name = "option" id = "1"/>
                    <label for ="1">
                        <div onclick="hide(document.getElementById('tooltip1'))" class = "tab-name button_cursor">HTML</div>
                        <div class = "tab-content">
                            <button class="button_cursor" onclick="copyClipboard('html1'); feedback(this)">Copy</button>
                           <pre><code id = "html1" class = "text_cursor">
&lt;img id = "cursor-follower" src = "your_cursor_image_here"&gt;
                            </code></pre>
                        </div>
                    </label>

                    <!-- Tab 2 -->
                    <input type = "radio" name = "option" id = "2"/>
                    <label for ="2">
                        <div onclick="hide(document.getElementById('tooltip1'))" class = "tab-name button_cursor">CSS</div>
                        <div class = "tab-content">
                            <button class="button_cursor" onclick="copyClipboard('css1'); feedback(this)">Copy</button>
                            <pre><code id = "css1" class = "text_cursor">
*{
    cursor: none;
}

/* Adjust width and height to your liking */ 
#cursor-follower{
    position: fixed;
    width: 63px; 
    height: auto;
    pointer-events: none;
    transform: translate(-50%,-50%); /* Use this to adjust the location of the picture */
    z-index: 9999;
}
                            </code></pre>
                        </div>
                    </label>
                    
                    <!-- Tab 3 -->
                    <input type = "radio" name = "option" id = "3"/>
                    <label for ="3">
                        <div onclick="hide(document.getElementById('tooltip1'))" class = "tab-name button_cursor">JS</div>
                        <div class = "tab-content">
                            <button class="button_cursor" onclick="copyClipboard('js1'); feedback(this)">Copy</button>
                            <pre><code id = "js1" class = "text_cursor">
//Don't Forget to update the image paths to your actual cursor images!!

const cursor = document.getElementById("cursor-follower");

const pointer = "assets/cursor/cursor_pointer.png";
const linkSelect = "assets/cursor/cursor_linkSelect.png";
const textSelect = "assets/cursor/cursor_textSelect.png";
const helpSelect = "assets/cursor/cursor_helpSelect.png";

// Make cursor move 

document.addEventListener("mousemove",function(e){
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

//Change cursor on hover of specific objects

const buttons = document.querySelectorAll(".button_cursor");
const text = document.querySelectorAll(".text_cursor");
const help = document.querySelectorAll(".help_cursor");


buttons.forEach(button => {
    button.addEventListener("mouseenter", () => {
        cursor.src = linkSelect;
    });

    button.addEventListener("mouseleave", () => {
        cursor.src = pointer;
    });
});

text.forEach(text => {
    text.addEventListener("mouseenter", () => {
        cursor.src = textSelect;
    });

    text.addEventListener("mouseleave", () => {
        cursor.src = pointer;
    });
});

help.forEach(help => {
    help.addEventListener("mouseenter", () => {
        cursor.src = helpSelect;
    });

    help.addEventListener("mouseleave", () => {
        cursor.src = pointer;
    });
});
                            </code></pre>
                        </div>
                    </label>
                </div>



                
                
                
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
